services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Define MYSQL_DATABASE en .env}
      MYSQL_USER: ${MYSQL_USER:?Define MYSQL_USER en .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
    ports:
      - '127.0.0.1:${DOCKER_MYSQL_PORT:-3308}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    profiles: ['app']
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      BACKEND_PORT: 3000
      FRONTEND_ORIGIN: http://localhost:${DOCKER_FRONTEND_PORT:-5174}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Define MYSQL_DATABASE en .env}
      MYSQL_USER: ${MYSQL_USER:?Define MYSQL_USER en .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
      MYSQL_CONNECTION_LIMIT: ${MYSQL_CONNECTION_LIMIT:-10}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Define ADMIN_EMAIL en .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en .env}
      SESSION_DURATION_HOURS: ${SESSION_DURATION_HOURS:-8}
      PASSWORD_RESET_TOKEN_MINUTES: ${PASSWORD_RESET_TOKEN_MINUTES:-30}
      PASSWORD_RESET_FROM_EMAIL: ${PASSWORD_RESET_FROM_EMAIL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_READ_ACCESS_TOKEN: ${TMDB_READ_ACCESS_TOKEN:-}
      TMDB_LANGUAGE: ${TMDB_LANGUAGE:-es-CL}
      TMDB_REQUEST_TIMEOUT_MS: ${TMDB_REQUEST_TIMEOUT_MS:-10000}
      SCRAPER_INGEST_TOKEN: ${SCRAPER_INGEST_TOKEN:-}
    ports:
      - '127.0.0.1:${DOCKER_BACKEND_PORT:-3001}:3000'
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    profiles: ['app']
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_DEMO_MODE: 'false'
    restart: unless-stopped
    environment:
      BACKEND_UPSTREAM: backend:3000
    ports:
      - '127.0.0.1:${DOCKER_FRONTEND_PORT:-5174}:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  scraper:
    profiles: ['scraping']
    build:
      context: .
      dockerfile: scraper/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      SCRAPER_USER_AGENT: ${SCRAPER_USER_AGENT:-CineArtePlatform/0.1 (contact@example.com)}
      SCRAPER_REQUEST_TIMEOUT_MS: ${SCRAPER_REQUEST_TIMEOUT_MS:-10000}
      SCRAPER_REQUEST_RETRIES: ${SCRAPER_REQUEST_RETRIES:-2}
      SCRAPER_BACKEND_URL: http://backend:3000/api/v1
      SCRAPER_INGEST_TOKEN: ${SCRAPER_INGEST_TOKEN:-}
      SCRAPER_MIN_SUCCESSFUL_SOURCES: ${SCRAPER_MIN_SUCCESSFUL_SOURCES:-3}
      SCRAPER_MIN_ACCEPTED_RECORDS: ${SCRAPER_MIN_ACCEPTED_RECORDS:-1}
      SCRAPER_SCHEDULE_DAY: ${SCRAPER_SCHEDULE_DAY:-wednesday}
      SCRAPER_SCHEDULE_TIME: ${SCRAPER_SCHEDULE_TIME:-09:00}
      SCRAPER_SCHEDULE_TIMEZONE: ${SCRAPER_SCHEDULE_TIMEZONE:-America/Santiago}
      SCRAPER_RUN_ON_START: ${SCRAPER_RUN_ON_START:-false}
      NEXO_INSTAGRAM_ACCESS_TOKEN: ${NEXO_INSTAGRAM_ACCESS_TOKEN:-}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
